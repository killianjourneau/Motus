<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Motus Junior — quatre petits jeux d'observation, dès 5 ans.">
<title>Motus Junior</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#071633">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Motus Junior">
<link rel="apple-touch-icon" href="./icons/icon-512.png">

<script>
  /* Thème et couleur partagés avec Motus, appliqués avant le rendu. */
  try{
    var t=JSON.parse(localStorage.getItem("motus.theme")); if(t) document.documentElement.dataset.theme=t;
    var a=JSON.parse(localStorage.getItem("motus.accent")); if(a) document.documentElement.dataset.accent=a;
  }catch(e){}
</script>

<style>
  :root{
    --bg:#071633; --bg-2:#0b2247; --cell:#10305f; --cell-edge:#1d477f;
    --red:#e23a44; --yellow:#ffcb2e; --absent:#12294a;
    --ink:#ffffff; --ink-dim:#8aa6cf;
    --accent:#e23a44;
  }
  :root[data-theme="light"]{
    --bg:#eef2f9; --bg-2:#dfe7f3; --cell:#cdd8ea; --cell-edge:#b6c5df;
    --red:#e23a44; --yellow:#f2be14; --absent:#aebbd0;
    --ink:#14233c; --ink-dim:#5c6c88;
  }
  :root[data-accent="blue"]{ --accent:#2f7de6; }
  :root[data-accent="green"]{ --accent:#0f8a58; }
  :root[data-accent="purple"]{ --accent:#8b5cf6; }
  :root[data-accent="orange"]{ --accent:#d4631a; }
  :root[data-accent="pink"]{ --accent:#cf3580; }
  :root[data-accent="teal"]{ --accent:#0c8579; }

  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color:var(--ink);
    background: radial-gradient(120% 90% at 50% 0%, var(--bg-2) 0%, var(--bg) 60%);
    background-attachment:fixed; min-height:100dvh; display:flex; flex-direction:column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header{ display:flex; align-items:center; justify-content:space-between; padding:10px clamp(12px,4vw,22px) 2px; gap:8px; }
  .brand{ display:flex; align-items:baseline; gap:7px; font-weight:800; font-size:21px; letter-spacing:.5px; }
  .brand .j{ font-size:13px; color:var(--ink-dim); font-weight:800; text-transform:uppercase; letter-spacing:1px; }
  .tools{ display:flex; gap:6px; }
  .icon-btn{ width:38px; height:38px; border:none; border-radius:11px; background:var(--cell); color:var(--ink);
    box-shadow:inset 0 0 0 1.5px var(--cell-edge); font-size:17px; cursor:pointer; }
  .icon-btn:active{ transform:scale(.93); }

  .games{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:8px clamp(12px,4vw,22px) 4px; }
  .gm{ border:none; border-radius:12px; background:var(--cell); color:var(--ink-dim);
    box-shadow:inset 0 0 0 1.5px var(--cell-edge); cursor:pointer; padding:7px 2px 6px;
    display:flex; flex-direction:column; align-items:center; gap:2px; }
  .gm .ic{ font-size:19px; line-height:1; }
  .gm .tx{ font-size:10.5px; font-weight:800; }
  .gm.on{ background:var(--accent); color:#fff; box-shadow:none; }

  .bar{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:4px clamp(12px,4vw,22px) 6px; }
  .levels{ display:flex; gap:6px; }
  .lv{ height:32px; padding:0 11px; border:none; border-radius:10px; background:var(--cell); color:var(--ink-dim);
    box-shadow:inset 0 0 0 1.5px var(--cell-edge); font-weight:800; font-size:12.5px; cursor:pointer; }
  .lv.on{ background:var(--accent); color:#fff; box-shadow:none; }
  .score{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:15px; }
  .score .hearts{ letter-spacing:1px; }
  .score .hearts.hide{ display:none; }

  main{ flex:1; display:flex; flex-direction:column; align-items:center; gap:12px; padding:2px 10px 14px; }
  .ask{ font-size:16px; font-weight:800; text-align:center; min-height:22px; line-height:1.35; }
  .ask b{ color:var(--accent); font-size:21px; }

  /* --- jeu des lettres --- */
  #word{ display:flex; gap:7px; flex-wrap:wrap; justify-content:center; }
  .tile{ width:var(--t); height:var(--t); border-radius:12px; background:var(--cell);
    box-shadow:inset 0 0 0 2px var(--cell-edge); display:grid; place-items:center;
    font-size:calc(var(--t)*.55); font-weight:800; }
  .tile.first{ background:var(--red); box-shadow:none; color:#fff; }
  .tile.done{ background:var(--accent); box-shadow:none; color:#fff; animation:pop .2s ease; }
  .tile.jump{ animation:jump .5s ease; }

  /* --- grille de choix, commune à plusieurs jeux --- */
  #choices{ display:grid; gap:10px; width:100%; max-width:440px; }
  #choices.c2{ grid-template-columns:repeat(2,1fr); }
  #choices.c3{ grid-template-columns:repeat(3,1fr); }
  .ch{ border:none; border-radius:18px; background:var(--cell); box-shadow:inset 0 0 0 2px var(--cell-edge);
    color:var(--ink); aspect-ratio:1.15; font-size:min(15vw,54px); cursor:pointer; display:grid; place-items:center; }
  .ch:active{ transform:scale(.94); }
  .ch.wrong{ opacity:.28; box-shadow:inset 0 0 0 2px var(--absent); pointer-events:none; }
  .ch.good{ background:var(--accent); box-shadow:none; }

  /* --- jeu du comptage --- */
  #countBox{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center;
    max-width:420px; min-height:130px; padding:12px; background:var(--cell); border-radius:18px;
    box-shadow:inset 0 0 0 1.5px var(--cell-edge); }
  #countBox span{ font-size:min(11vw,40px); line-height:1; animation:pop .2s ease; }
  .nums{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:440px; }
  .num{ width:56px; height:56px; border:none; border-radius:16px; background:var(--cell); color:var(--ink);
    box-shadow:inset 0 0 0 2px var(--cell-edge); font-size:24px; font-weight:800; cursor:pointer; }
  .num:active{ transform:scale(.93); }
  .num.wrong{ opacity:.3; pointer-events:none; }
  .num.good{ background:var(--accent); color:#fff; box-shadow:none; }

  /* --- jeu de mémoire --- */
  #memo{ display:grid; gap:9px; width:100%; max-width:400px; }
  #memo.m3{ grid-template-columns:repeat(3,1fr); }
  #memo.m4{ grid-template-columns:repeat(4,1fr); }
  #memo.dense{ gap:7px; max-width:340px; }
  #memo.dense .card{ border-radius:12px; font-size:min(8vw,28px); }
  .card{ aspect-ratio:1; border:none; border-radius:16px; background:var(--accent); cursor:pointer;
    display:grid; place-items:center; font-size:min(11vw,38px); color:transparent; transition:background .18s; }
  .card.up{ background:var(--cell); box-shadow:inset 0 0 0 2px var(--cell-edge); color:var(--ink); }
  .card.done{ background:var(--cell); box-shadow:none; opacity:.4; color:var(--ink); pointer-events:none; }
  .card:active{ transform:scale(.95); }

  @keyframes pop{ from{transform:scale(.7)} to{transform:scale(1)} }
  @keyframes jump{ 0%,100%{transform:translateY(0)} 40%{transform:translateY(-16px)} }
  .shake{ animation:shk .34s ease; }
  @keyframes shk{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(4px)} }

  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; padding:18px; z-index:100; }
  .overlay.open{ display:flex; }
  .modal{ width:min(420px,100%); max-height:88dvh; overflow:auto; background:var(--bg-2); border-radius:20px;
    padding:22px; box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 0 0 1.5px var(--cell-edge); text-align:center; }
  .modal h2{ font-size:26px; margin-bottom:6px; }
  .modal p{ font-size:15px; line-height:1.5; color:var(--ink-dim); margin-bottom:12px; }
  .big{ font-size:44px; font-weight:800; margin:6px 0; color:var(--accent); }
  .btn{ width:100%; height:52px; border:none; border-radius:14px; background:var(--accent); color:#fff;
    font-weight:800; font-size:17px; cursor:pointer; margin-top:8px; }
  .btn.ghost{ background:var(--cell); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--cell-edge); }
  .btn:active{ transform:scale(.97); }
  .rules{ text-align:left; list-style:none; }
  .rules li{ padding:10px 12px; margin-bottom:7px; background:var(--cell); border-radius:12px;
    box-shadow:inset 0 0 0 1.5px var(--cell-edge); font-size:14.5px; line-height:1.45; color:var(--ink); }
</style>
</head>
<body>

  <header>
    <div class="brand">MOTUS <span class="j">Junior</span></div>
    <div class="tools">
      <button class="icon-btn" id="btnGame" aria-label="Revenir à Motus">🔤</button>
      <button class="icon-btn" id="btnTheme" aria-label="Thème">☀️</button>
      <button class="icon-btn" id="btnHelp" aria-label="Comment jouer">?</button>
    </div>
  </header>

  <div class="games" id="games">
    <button class="gm" data-g="intrus"><span class="ic">🧩</span><span class="tx">Intrus</span></button>
    <button class="gm" data-g="compter"><span class="ic">🔢</span><span class="tx">Compter</span></button>
    <button class="gm" data-g="memo"><span class="ic">🧠</span><span class="tx">Mémoire</span></button>
    <button class="gm" data-g="lettre"><span class="ic">🔠</span><span class="tx">Lettres</span></button>
  </div>

  <div class="bar">
    <div class="levels">
      <button class="lv on" data-lv="facile">Facile</button>
      <button class="lv" data-lv="moyen">Moyen</button>
      <button class="lv" data-lv="expert">Expert</button>
    </div>
    <div class="score">
      <span class="hearts" id="hearts">❤️❤️❤️</span>
      <span id="stars">⭐ 0</span>
    </div>
  </div>

  <main>
    <div class="ask" id="ask"></div>
    <div id="word"></div>
    <div id="countBox" style="display:none"></div>
    <div id="choices"></div>
    <div class="nums" id="nums" style="display:none"></div>
    <div id="memo" style="display:none"></div>
  </main>

  <div class="overlay" id="endOverlay">
    <div class="modal">
      <h2 id="endTitle">Partie terminée</h2>
      <div class="big" id="endStars">⭐ 0</div>
      <p id="endSub"></p>
      <p id="endWord" style="display:none"></p>
      <button class="btn" id="btnAgain">Rejouer</button>
    </div>
  </div>

  <div class="overlay" id="confirmOverlay">
    <div class="modal">
      <h2>Recommencer ?</h2>
      <p>Ta partie en cours va repartir de zéro.</p>
      <button class="btn" id="confirmYes">Oui</button>
      <button class="btn ghost" id="confirmNo">Non, continuer</button>
    </div>
  </div>

  <div class="overlay" id="helpOverlay">
    <div class="modal">
      <h2>Comment jouer</h2>
      <ul class="rules" id="helpRules"></ul>
      <button class="btn" id="btnHelpOk">J'ai compris</button>
    </div>
  </div>

<script src="./dico/motus-enfant.js?v=1.26.0"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var DATA   = window.MOTUS_ENFANT || {};
  var IMAGES = DATA.images || [{e:"🐱",m:"CHAT",c:"animal"}];
  var CATS   = DATA.cats || {};
  var LIVES  = 3;

  var store = {
    get:function(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
    set:function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  };

  var game   = store.get("motus.enfant.game","intrus");   // sans lecture par défaut : jouable dès 5 ans
  var level  = store.get("motus.enfant.level","facile");
  var best   = store.get("motus.enfant.best",{}) || {};
  var lives = LIVES, stars = 0, locked = false;
  var target = null, choices = [];        // lettres / intrus
  var countN = 0;                          // comptage
  var memo = [], memoUp = [], memoDone = 0; // mémoire

  /* ---------- thème ---------- */
  var theme = store.get("motus.theme","dark");
  function applyTheme(){
    document.documentElement.dataset.theme = theme;
    document.querySelector('meta[name=theme-color]').content = (theme==="light") ? "#eef2f9" : "#071633";
    $("btnTheme").textContent = (theme==="dark") ? "☀️" : "🌙";
  }
  $("btnTheme").addEventListener("click", function(){
    theme = (theme==="dark")?"light":"dark"; store.set("motus.theme",theme); applyTheme();
  });

  /* ---------- outils ---------- */
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var x=a[i]; a[i]=a[j]; a[j]=x; } return a; }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function vibrate(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
  function byCat(c){ return IMAGES.filter(function(x){ return x.c===c; }); }
  function group(c){ return (CATS[c]||{}).g || c; }
  function catName(c){ return (CATS[c]||{}).n || "autre chose"; }
  function shakeEl(id){ var e=$(id); if(!e) return; e.classList.add("shake"); setTimeout(function(){ e.classList.remove("shake"); }, 350); }
  function hide(){ ["word","countBox","choices","nums","memo"].forEach(function(id){ $(id).style.display="none"; $(id).innerHTML=""; }); }

  function paintScore(){
    var h=$("hearts");
    h.classList.toggle("hide", game==="memo");        // en mémoire, se tromper ne coûte rien
    h.textContent = "❤️".repeat(Math.max(0,lives)) + "🖤".repeat(Math.max(0,LIVES-lives));
    $("stars").textContent = "⭐ " + stars;
  }
  function bestKey(){ return game + ":" + level; }
  function bestVal(){ return best[bestKey()] || 0; }

  /* =======================================================
     JEU 1 — L'INTRUS  (aucune lecture : dès 5 ans)
     ======================================================= */
  function roundIntrus(){
    var total = (level==="expert") ? 9 : (level==="moyen") ? 6 : 4;
    var proche = (level !== "facile");        // dès Moyen, l'intrus vient d'une famille voisine
    var voisines = function(c){
      return Object.keys(CATS).filter(function(o){ return o!==c && byCat(o).length && group(o)===group(c); });
    };
    var cats = Object.keys(CATS).filter(function(c){
      if(byCat(c).length < total) return false;
      // dès Moyen, la famille doit avoir une voisine, sinon l'intrus saute aux yeux
      return proche ? voisines(c).length > 0 : true;
    });
    var c = pick(cats);
    // Facile : l'intrus vient d'un tout autre univers. Plus dur : univers voisin.
    var others = proche
      ? voisines(c)
      : Object.keys(CATS).filter(function(o){ return o!==c && byCat(o).length && group(o)!==group(c); });
    if(!others.length) others = Object.keys(CATS).filter(function(o){ return o!==c && byCat(o).length; });
    var oc = pick(others);
    var same = shuffle(byCat(c).slice()).slice(0, total-1);
    var odd  = pick(byCat(oc));
    target = odd; target.__cat = c;
    choices = shuffle(same.concat([odd]));

    var box = $("choices");
    box.style.display=""; box.className = (total===4) ? "c2" : "c3";
    box.innerHTML = choices.map(function(x,i){
      return '<button class="ch" data-i="'+i+'" aria-label="Choix '+(i+1)+'">'+x.e+'</button>';
    }).join("");
    Array.prototype.forEach.call(box.querySelectorAll(".ch"), function(b){
      b.addEventListener("click", function(){ answerIntrus(+b.dataset.i, b); });
    });
    $("ask").innerHTML = "Touche celui qui n'est <b>pas comme les autres</b>";
  }
  function answerIntrus(i, btn){
    if(locked) return;
    if(choices[i].m === target.m){
      locked = true; btn.classList.add("good");
      win("Bravo ! " + target.m + ", ce n'est pas " + catName(target.__cat) + ".");
      return;
    }
    btn.classList.add("wrong");
    loseLife("Non : " + choices[i].m + ", c'est " + catName(target.__cat) + ", comme les autres.",
             "L'intrus, c'était " + target.m + ".");
  }

  /* =======================================================
     JEU 2 — COMPTER  (aucune lecture : dès 5 ans)
     ======================================================= */
  function roundCompter(){
    target = null;                       // ce jeu ne révèle pas de mot en fin de partie
    var max, cells;
    if(level==="expert"){
      // il faut compter UNE seule sorte au milieu d'autres : bien plus exigeant
      max = 12;
      countN = 2 + Math.floor(Math.random()*8);              // 2 à 9 à trouver
      var cible = pick(IMAGES);
      var autres = shuffle(IMAGES.filter(function(x){ return x.e !== cible.e; })).slice(0,3);
      cells = [];
      for(var k=0;k<countN;k++) cells.push(cible.e);
      var bruit = 4 + Math.floor(Math.random()*5);            // 4 à 8 intruses
      for(var j=0;j<bruit;j++) cells.push(pick(autres).e);
      shuffle(cells);
      $("ask").innerHTML = 'Combien y a-t-il de <b>' + cible.e + '</b> ?';
    } else {
      max = (level==="moyen") ? 10 : 6;
      countN = 1 + Math.floor(Math.random()*max);
      var img = pick(IMAGES);
      cells = [];
      for(var i=0;i<countN;i++) cells.push(img.e);
      $("ask").innerHTML = "Combien y en a-t-il ?";
    }
    var box = $("countBox"); box.style.display="flex";
    box.innerHTML = cells.map(function(e){ return '<span>'+e+'</span>'; }).join("");

    var nums = $("nums"); nums.style.display="flex";
    var html=""; for(var n=1;n<=max;n++) html += '<button class="num" data-n="'+n+'">'+n+'</button>';
    nums.innerHTML = html;
    Array.prototype.forEach.call(nums.querySelectorAll(".num"), function(b){
      b.addEventListener("click", function(){ answerCompter(+b.dataset.n, b); });
    });
  }
  function answerCompter(n, btn){
    if(locked) return;
    if(n === countN){
      locked = true; btn.classList.add("good");
      win("Bravo ! Il y en a bien " + countN + ".");
      return;
    }
    btn.classList.add("wrong");
    loseLife(n < countN ? "Non, il y en a plus que " + n + " — recompte !"
                        : "Non, il y en a moins que " + n + " — recompte !",
             "Il y en avait " + countN + ".");
  }

  /* =======================================================
     JEU 3 — MÉMOIRE  (aucune lecture : dès 5 ans)
     ======================================================= */
  function roundMemo(){
    target = null;
    var pairs = (level==="expert") ? 12 : (level==="moyen") ? 8 : 4;
    var chosen = shuffle(IMAGES.slice()).slice(0, pairs);
    memo = shuffle(chosen.concat(chosen).map(function(x,i){ return {e:x.e, m:x.m, id:i}; }));
    memoUp = []; memoDone = 0;
    var box = $("memo"); box.style.display="grid";
    box.className = "m4" + (pairs>=12 ? " dense" : "");
    box.innerHTML = memo.map(function(c,i){
      return '<button class="card" data-i="'+i+'" aria-label="Carte '+(i+1)+'">'+c.e+'</button>';
    }).join("");
    Array.prototype.forEach.call(box.querySelectorAll(".card"), function(b){
      b.addEventListener("click", function(){ flip(+b.dataset.i, b); });
    });
    $("ask").innerHTML = "Retrouve les <b>paires</b> identiques";
  }
  function flip(i, btn){
    if(locked || btn.classList.contains("up") || btn.classList.contains("done")) return;
    btn.classList.add("up");
    memoUp.push({i:i, el:btn});
    if(memoUp.length < 2) return;
    locked = true;
    var a = memoUp[0], b = memoUp[1];
    if(memo[a.i].m === memo[b.i].m){
      setTimeout(function(){
        a.el.classList.add("done"); b.el.classList.add("done");
        memoUp = []; memoDone++; locked = false;
        stars++; paintScore(); vibrate([10]);
        $("ask").innerHTML = "Bravo ! Une paire de <b>" + memo[a.i].m + "</b>";
        if(memoDone * 2 === memo.length){
          locked = true;
          setTimeout(function(){ endRun(null, "Tableau terminé !"); }, 900);
        }
      }, 320);
    } else {
      vibrate([25]);
      setTimeout(function(){
        a.el.classList.remove("up"); b.el.classList.remove("up");
        memoUp = []; locked = false;
        $("ask").innerHTML = "Pas pareil — essaie encore !";
      }, 900);
    }
  }

  /* =======================================================
     JEU 4 — LES LETTRES  (demande de connaître l'alphabet)
     ======================================================= */
  function sizeTiles(n){
    var w = Math.min(window.innerWidth-28, 420);
    var t = Math.floor(Math.min((w-(n-1)*7)/n, 54));
    document.documentElement.style.setProperty("--t", Math.max(26,t)+"px");
  }
  function drawWord(reveal){
    var m = target.m; sizeTiles(m.length);
    var html = "";
    for(var i=0;i<m.length;i++){
      if(i===0) html += '<div class="tile first">'+m[0]+'</div>';
      else if(reveal) html += '<div class="tile done">'+m[i]+'</div>';
      else html += '<div class="tile"></div>';
    }
    $("word").innerHTML = html; $("word").style.display="flex";
  }
  function roundLettre(){
    target = pick(IMAGES);
    var ini = target.m[0];
    var others = IMAGES.filter(function(x){ return x.m !== target.m; });
    var diff = shuffle(others.filter(function(x){ return x.m[0] !== ini; }));
    var same = shuffle(others.filter(function(x){ return x.m[0] === ini && x.m.length !== target.m.length; }));
    var total = (level==="expert") ? 9 : (level==="moyen") ? 6 : 4;
    var nSame = (level==="expert") ? 3 : (level==="moyen") ? 2 : 0;
    var picked = same.slice(0, nSame);
    picked = picked.concat(diff.slice(0, total-1-picked.length));
    choices = shuffle(picked.concat([target]));

    var box = $("choices");
    box.style.display=""; box.className = (total===4) ? "c2" : "c3";
    box.innerHTML = choices.map(function(x,i){
      return '<button class="ch" data-i="'+i+'" aria-label="Choix '+(i+1)+'">'+x.e+'</button>';
    }).join("");
    Array.prototype.forEach.call(box.querySelectorAll(".ch"), function(b){
      b.addEventListener("click", function(){ answerLettre(+b.dataset.i, b); });
    });
    $("ask").innerHTML = 'Quel mot commence par <b>'+ini+'</b> ?';
    drawWord(false);
  }
  function answerLettre(i, btn){
    if(locked) return;
    if(choices[i].m === target.m){
      locked = true; btn.classList.add("good");
      drawWord(true);
      var tiles = $("word").querySelectorAll(".tile");
      Array.prototype.forEach.call(tiles, function(t,k){ setTimeout(function(){ t.classList.add("jump"); }, k*70); });
      win("Bravo ! C'est le mot " + target.m);
      return;
    }
    btn.classList.add("wrong");
    loseLife("Non : ça, c'est " + choices[i].m + ". Cherche un mot de " + target.m.length + " lettres qui commence par " + target.m[0] + " !",
             "Le mot cherché était " + target.m + ".");
  }

  /* =======================================================
     Déroulement commun
     ======================================================= */
  function win(msg){
    stars++; paintScore(); vibrate([12,40,12]);
    $("ask").innerHTML = msg;
    setTimeout(newRound, 1400);
  }
  /* msg = explication de l'erreur ; last = ce qu'on révèle si c'était la dernière vie */
  function loseLife(msg, last){
    lives--; paintScore(); vibrate([30,60,30]);
    shakeEl(game==="lettre" ? "word" : "choices");
    if(lives<=0){
      locked = true;
      $("ask").innerHTML = msg + " " + last;
      setTimeout(function(){ endRun(target); }, 1600);
      return;
    }
    $("ask").innerHTML = msg;
  }

  function newRound(){
    locked = false; hide();
    if(game==="intrus")       roundIntrus();
    else if(game==="compter") roundCompter();
    else if(game==="memo")    roundMemo();
    else                      roundLettre();
  }

  function endRun(missed, title){
    var b = bestVal();
    if(stars > b){ best[bestKey()] = stars; store.set("motus.enfant.best", best); b = stars; }
    $("endTitle").textContent = title || (stars>0 ? "Bien joué !" : "On réessaie ?");
    $("endStars").textContent = "⭐ " + stars;
    $("endSub").textContent = (stars>=b && stars>0) ? "C'est ton meilleur score !"
      : "Ton record : " + b + (b>1 ? " étoiles" : " étoile");
    var ew = $("endWord");
    if(missed){ ew.innerHTML = 'C\'était <b>'+missed.m+'</b> '+missed.e; ew.style.display="block"; }
    else { ew.style.display="none"; }
    $("endOverlay").classList.add("open");
  }
  function startRun(){
    $("endOverlay").classList.remove("open");
    lives = LIVES; stars = 0; locked = false;
    paintScore(); newRound();
  }

  /* ---------- changement de jeu ou de niveau ---------- */
  function hasProgress(){ return stars>0 || lives<LIVES; }
  function askSwitch(apply){
    if(!hasProgress()){ apply(); return; }
    $("confirmOverlay").classList.add("open");
    $("confirmYes").onclick = function(){ $("confirmOverlay").classList.remove("open"); apply(); };
    $("confirmNo").onclick  = function(){ $("confirmOverlay").classList.remove("open"); };
  }
  function paintPickers(){
    Array.prototype.forEach.call(document.querySelectorAll(".gm"), function(x){ x.classList.toggle("on", x.dataset.g===game); });
    Array.prototype.forEach.call(document.querySelectorAll(".lv"), function(x){ x.classList.toggle("on", x.dataset.lv===level); });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".gm"), function(b){
    b.addEventListener("click", function(){
      if(b.dataset.g === game) return;
      askSwitch(function(){
        game = b.dataset.g; store.set("motus.enfant.game", game);
        paintPickers(); startRun();
      });
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".lv"), function(b){
    b.addEventListener("click", function(){
      if(b.dataset.lv === level) return;
      askSwitch(function(){
        level = b.dataset.lv; store.set("motus.enfant.level", level);
        paintPickers(); startRun();
      });
    });
  });

  /* ---------- aide, adaptée au jeu en cours ---------- */
  var HELP = {
    intrus: ["Des images sont affichées. Toutes vont ensemble, sauf une.",
             "Touche <b>l'intrus</b> : celui qui n'est pas comme les autres.",
             "<b>Facile</b> : 4 images, l'intrus est très différent. <b>Moyen</b> : 6 images, l'intrus vient d'une famille voisine. <b>Expert</b> : 9 images."],
    compter:["Des images apparaissent. Compte-les et touche le <b>bon chiffre</b>.",
             "<b>Facile</b> : jusqu'à 6. <b>Moyen</b> : jusqu'à 10.",
             "<b>Expert</b> : les images sont mélangées, il faut compter <b>une seule sorte</b> !"],
    memo:   ["Toutes les cartes cachent une image.",
             "Touche deux cartes : si elles sont <b>identiques</b>, elles restent retournées et tu gagnes une ⭐.",
             "<b>Facile</b> : 4 paires. <b>Moyen</b> : 8 paires. <b>Expert</b> : 12 paires !",
             "Se tromper ne coûte rien : prends ton temps."],
    lettre: ["Un mot est caché. Tu vois sa <b>première lettre</b> et le nombre de lettres.",
             "Touche l'image du mot qui commence par cette lettre. Exemple : <b>K</b> ➜ le 🥝 kiwi.",
             "Plus le niveau monte, plus il y a d'images qui commencent par la même lettre.",
             "Erreur : tu perds un ❤️. Avec trois erreurs, la partie s'arrête."]
  };
  function fillHelp(){
    $("helpRules").innerHTML = (HELP[game]||[]).map(function(t){ return "<li>"+t+"</li>"; }).join("");
  }

  /* ---------- écouteurs ---------- */
  $("btnAgain").addEventListener("click", startRun);
  $("btnGame").addEventListener("click", function(){ location.href="./index.html"; });
  $("btnHelp").addEventListener("click", function(){ fillHelp(); $("helpOverlay").classList.add("open"); });
  $("btnHelpOk").addEventListener("click", function(){ $("helpOverlay").classList.remove("open"); });
  window.addEventListener("resize", function(){ if(game==="lettre" && target) sizeTiles(target.m.length); });

  /* ---------- démarrage ---------- */
  applyTheme();
  paintPickers();
  startRun();
  if(!store.get("motus.enfant.seen3",false)){ fillHelp(); $("helpOverlay").classList.add("open"); store.set("motus.enfant.seen3",true); }
})();
</script>
</body>
</html>
